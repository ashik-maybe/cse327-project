version: "3.8"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: campbridge
      POSTGRES_PASSWORD: campbridge
      POSTGRES_DB: campbridge
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campbridge -d campbridge"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  api:
    build:
      context: .
      dockerfile: apps/backend/Containerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://campbridge:campbridge@db:5432/campbridge
      PORT: "4000"
      SESSION_SECRET: change_this_in_production
      CORS_ORIGIN: http://localhost:3000
      AUTH_COOKIE_NAME: campbridge_session
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/frontend/Containerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  db_data:
